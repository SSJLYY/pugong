# ============================================================
# 《普攻永久增加生命上限》v2.2 · 136 游戏厅
# 静态前端 + 后端 API 反代（同源，免 CORS）
# ============================================================

# 带版本参数（?v= 非空）的静态资源视为内容不可变：追加 immutable，
# 浏览器直接命中本地缓存，连 304 协商请求都省掉。
# 本文件被 include 进 http{}，map 是 http 上下文指令，放这里合法；
# $arg_v 即请求的 ?v= 参数，未携带/空值落到第一个分支。
# 注意：改版发布时必须同步更新 ?v= 值，否则 immutable 会把旧文件钉死在缓存里。
map $arg_v $games_asset_cache_control {
    ""      "public, max-age=604800";            # 未带版本：7 天
    default "public, max-age=604800, immutable"; # 带 ?v=：7 天 + immutable
}

server {
    listen 8088;
    server_name _;
    root /data/games;
    charset utf-8;

    # 不在 Server 响应头与默认错误页暴露 nginx 版本号，减少针对性探测/投毒
    server_tokens off;

    # 游戏接口请求体均为小 JSON（存档、操作上报等），64k 绰绰有余；
    # 收紧默认的 1m，超限直接 413，防恶意大包打后端。静态资源走 GET 无请求体，不受影响
    client_max_body_size 64k;

    # ---------- 访问日志 ----------
    # 未显式配置时沿用主配置（通常 /var/log/nginx/access.log）。
    # 1s 轮询 × 玩家数日志量可观（百人在线约 20~30MB/天）：
    # 请确认 136 机 /etc/logrotate.d/nginx 覆盖该文件；若爆盘，可打开下方
    # API location 里的 access_log off 只关接口路径日志（保留静态日志便于排查）。

    # ---------- 静态与接口文本响应 gzip ----------
    gzip on;
    # 新版 nginx（1.21.4 起）默认 mime.types 把 .js 标为 text/javascript，
    # 只写 application/javascript 会导致新版下 js 不压缩；两个都列以兼容新旧版本
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;
    # 响应追加 Vary: Accept-Encoding，避免压缩版本被中间缓存错发给不支持 gzip 的客户端
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;

    location = / {
        return 302 /portal/;
    }

    # ---------- 后端 API 反代 ----------
    # ^~ 前缀匹配优先于正则静态 location，防止 /xxx.js 之类 API 路径被静态规则截走
    location ^~ /gongpu/api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 【重点检查项：真实 IP 传递】原配置已有 X-Forwarded-For，限速不会按 127.0.0.1 全豁免；
        # 但原值 $proxy_add_x_forwarded_for 是“保留客户端传入的 XFF，再追加 $remote_addr”，
        # 而 8088 是边缘入口、前面没有可信代理，攻击者可自带伪造 XFF：
        # 后端 AuthRateLimiter 若取 XFF 首段，限速键就由攻击者指定，可轮换伪造 IP 绕过限速。
        # 改为 $remote_addr 直接覆写——正常浏览器不发 XFF，对真实用户两种写法结果一致。
        # 若日后在前面加 CDN/LB，需改回追加模式并配合 ngx_http_realip 的 set_real_ip_from 白名单。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 均为回环转发、毫秒级响应：connect 5s 保持不变（回环建连远快于此）；
        # read 30s→10s——1s 轮询与写请求远用不到 30s，缩短可让后端假死时更快释放挂起连接；
        # send 保持 30s（仅约束请求体上行，游戏包体极小，无实际影响）
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 30s;
        # 日志降噪备选：若访问日志爆盘，取消下一行注释可仅关闭 API 路径的访问日志
        # （关闭后刷接口/滥用排查失去依据，建议优先做 logrotate，慎开）
        # access_log off;
    }

    # ---------- 游戏静态页 ----------
    location /gongpu/ {
        try_files $uri $uri/ /gongpu/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # index.html 不缓存，保证改版即时生效（精确匹配优先级最高）
    location = /gongpu/index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 静态资源缓存：location 匹配不含查询串，?v=xx 的 js/css 仍落在这里；
    # Cache-Control 由文件顶部 map 统一生成（带 ?v= 为 7d+immutable，否则 7d）。
    # 原先 expires 7d + add_header "public" 会发出两个 Cache-Control 头，此处合并为一个
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|mp3|ogg|wav|woff2?)$ {
        add_header Cache-Control $games_asset_cache_control;
    }
}
